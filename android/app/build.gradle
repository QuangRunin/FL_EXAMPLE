plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.example"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions "default"
    productFlavors {
        def devSigningConfigs = signingConfigs.debug
        def prodSigningConfigs = signingConfigs.debug
        def stgSigningConfigs = signingConfigs.debug

        prod {
            dimension "default"
            applicationId "com.example.example"
            signingConfig prodSigningConfigs
            versionNameSuffix = ""
            resValue "string", "app_name", "Example"
        }
        stg {
            dimension "default"
            applicationId "com.example.example"
            signingConfig stgSigningConfigs
            versionNameSuffix = ""
            resValue "string", "app_name", "Example STG"
        }
        dev {
            dimension "default"
            applicationId "com.example.example"
            signingConfig devSigningConfigs
            versionNameSuffix = ""
            resValue "string", "app_name", "Example DEV"
        }
    }
}

flutter {
    source = "../.."
}
